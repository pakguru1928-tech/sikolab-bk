<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A2A66">
  <title>SIKOLAB BK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font dimuat tanpa menahan tampilan: aplikasi langsung tampil dengan font sistem, lalu berganti saat font siap. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="topload" aria-hidden="true"></div>

  <!-- Splash saat memuat -->
  <div id="splash" class="splash"><div style="text-align:center"><div class="sp-logo" aria-hidden="true"></div><div class="fw7" style="font-family:var(--font-h);font-size:18px">SIKOLAB BK</div><div class="xs" style="opacity:.75;margin-top:4px">Sistem Informasi Kolaborasi Bimbingan dan Konseling</div><div class="ring" style="width:28px;height:28px;border-width:3px;margin:18px auto 0"></div></div></div>

  <!-- Halaman masuk -->
  <div id="login-root" class="hide"></div>

  <!-- Shell aplikasi (SPA): hanya #app-container yang berganti isi -->
  <div id="shell" class="hide">
    <aside class="sidebar" id="sidebar" aria-label="Navigasi utama"></aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main id="app-container" class="page" tabindex="-1" aria-live="polite"></main>
    </div>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi cepat"></nav>
  </div>

  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/formisi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
